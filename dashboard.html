<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Needed for the "Download Excel Log" export button -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        [hidden] { display: none !important; }

        /* Graphs / Logs switch */
        .view-tabs { display: flex; gap: 8px; margin: 0 0 16px; }
        .view-tab { padding: 9px 22px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 8px;
                    cursor: pointer; font-weight: 600; font-size: 0.95rem; color: #334155; }
        .view-tab:hover { background: #eef2f7; }
        .view-tab.active { background: #2563eb; border-color: #2563eb; color: #fff; }

        /* Logs table */
        .log-toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
        .log-toolbar select { padding: 5px 8px; }
        .log-count { color: #64748b; font-size: 0.9rem; }
        .log-table-wrap { max-height: 70vh; overflow: auto; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; }
        .log-table { border-collapse: collapse; width: 100%; font-size: 0.9rem; white-space: nowrap; }
        .log-table th { position: sticky; top: 0; background: #f1f5f9; text-align: left; padding: 9px 12px;
                        border-bottom: 1px solid #e2e8f0; z-index: 1; }
        .log-table td { padding: 6px 12px; border-bottom: 1px solid #f1f5f9; }
        .log-table th.num, .log-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .log-table tbody tr:nth-child(even) { background: #f8fafc; }
        .log-table td.dim { color: #94a3b8; }

        /* per-graph buttons, pop-ups */
        .card-tools { display: flex; gap: 6px; align-items: center; }
        .tool-btn { padding: 3px 10px; font-size: 0.8rem; border: 1px solid #cbd5e1; background: #fff;
                    border-radius: 6px; cursor: pointer; color: #334155; }
        .tool-btn:hover { background: #f1f5f9; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 1000;
                         display: flex; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: #fff; border-radius: 10px; width: min(760px, 100%); max-height: 88vh;
                     display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                      padding: 12px 16px; border-bottom: 1px solid #e2e8f0; }
        .modal-head h3 { margin: 0; font-size: 1.05rem; }
        .modal-close { border: none; background: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: #64748b; }
        .modal-body { padding: 14px 16px; overflow: auto; }
        .modal-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .modal-table-wrap { max-height: 58vh; }
        .modal-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .limit-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 0; }
        .limit-field input { width: 140px; padding: 6px 8px; }
        .limit-check { display: block; margin-top: 14px; font-size: 0.9rem; color: #334155; }
        .limit-msg { color: #dc2626; font-weight: 600; min-height: 1.2em; margin-top: 10px; }
        .log-table td.out { color: #dc2626; font-weight: 700; }

        /* export button + graph list */
        .export-wrap { position: relative; display: inline-block; }
        .btn-export { padding: 10px 20px; background: #0f766e; color: #fff; border: none; border-radius: 6px;
                      cursor: pointer; font-weight: bold; }
        .btn-export:hover { background: #115e59; }
        .export-menu { position: absolute; top: 100%; left: 0; margin-top: 8px; width: 560px; max-width: 92vw;
                       background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; z-index: 900;
                       box-shadow: 0 10px 30px rgba(0,0,0,0.18); overflow: hidden; }
        .export-head { padding: 10px 14px; font-weight: 700; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
        .export-item { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                       padding: 9px 14px; border-bottom: 1px solid #f1f5f9; }
        .export-item:last-of-type { border-bottom: none; }
        .export-name { font-size: 0.92rem; color: #0f172a; }
        .export-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .export-name { flex: 1; min-width: 0; }
        .export-period { padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 0.85rem; }
        .export-msg { padding: 8px 14px; font-size: 0.85rem; color: #dc2626; min-height: 1.1em; }
        .export-msg.ok { color: #15803d; }
    </style>
</head>

<body>

    <div id="pageHeader"></div>

    <!-- VIEW SWITCH: Graphs / Logs -->
    <div class="view-tabs">
        <button id="tabGraphs" class="view-tab active" type="button">Graphs</button>
        <button id="tabLogs" class="view-tab" type="button">Logs</button>
    </div>

    <!-- LIVE FEED CONTROLS -->
    <div class="controls live-controls">
        <button id="downloadLog" class="btn-download">&#8681; Download Excel Log</button>
        <span id="liveStatus" class="status">Feed stopped.</span>
    </div>

    <!-- SYSTEM INTERRUPT CONTROLS -->
    <div class="control-panel" style="margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
        <button id="btn-interrupt-d1" onclick="toggleInterrupt('d1')" style="padding: 10px 20px; background: #ea580c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Interrupt Device 1 (Master)
        </button>
    </div>

    <!-- MANUAL SETPOINT: CONST dP / CONST FLOW -->
    <div class="control-panel" style="margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;">
        <label>Control mode<br>
            <select id="spMode">
                <option value="dp">Const dP</option>
                <option value="flow">Const Flow</option>
            </select>
        </label>
        <label id="spDpWrap">Const dP (bar)<br>
            <input id="spDp" type="number" step="0.1" min="0" max="2" style="width: 100px;">
        </label>
        <label id="spFlowWrap">Const Flow (L/min)<br>
            <input id="spFlow" type="number" step="10" min="0" max="2500" style="width: 120px;">
        </label>
        <button id="btnApplySetpoint" style="padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Apply</button>
        <span id="spMsg" style="font-weight: bold;"></span>

        <!-- EXPORT ONE GRAPH'S TABLE: pick the graph by name -->
        <span class="export-wrap">
            <button id="btnExportGraph" type="button" class="btn-export">&#8681; Export</button>
            <div id="exportMenu" class="export-menu" hidden></div>
        </span>
    </div>

    <!-- GRAPHS VIEW -->
    <div id="viewGraphs">
        <!-- Charts are inserted here by dashboard.js -->
        <div id="chartGrid" class="dashboard-grid"></div>
    </div>

    <!-- LOGS VIEW (table, newest reading on top, updates live) -->
    <div id="viewLogs" hidden>
        <div class="log-toolbar">
            <label>Rows to show
                <select id="logLimit">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                </select>
            </label>
            <span id="logCount" class="log-count"></span>
        </div>
        <div class="log-table-wrap">
            <table class="log-table">
                <thead id="logHead"></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
    </div>

    <script src="pages.js"></script>
    <script src="nav.js"></script>
    <script src="charts.js"></script>
    <script src="realtime.js"></script>

    <script src="dashboard.js"></script>

</body>

</html>
